# Triologue frontend — behind Traefik (no SSL, port 80 only)

# http-level directives: docker-compose.yml mounts this file at
# /etc/nginx/conf.d/default.conf, which nginx.conf includes inside http {}, so
# log_format is valid at this top level.
# client/src/lib/fileUrl.ts appends ?ft=<file token>, a short-lived
# file-scoped token, to /api/files/ URLs and server/src/routes/files.ts
# accepts it (never the session JWT); the default format logs "$request"
# with the query string, which would put the token in the container log.
# This format logs the request line without the query, for the files location
# only, as defence in depth: the token is short-lived but still a credential;
# every other request keeps the default line.
log_format files_without_query '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;
    rewrite ^/api/files/(.*)$ /api/f/$1 last;

    # Frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # HTML files - never cache
    location ~ \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri /index.html;
    }

    # Static assets — cache forever (fingerprinted)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API reverse proxy. The ^~ modifier makes this prefix win over the
    # regex location ~ \.html$ above, so an /api/ path can never be served
    # by it.
    location ^~ /api/ {
        # Let a full-size upload reach the server instead of nginx answering
        # 413 at its 1 MB default. Keep in step with MAX_FILE_SIZE (10 MB) in
        # server/src/routes/upload.ts; 12 MB adds headroom for the multipart
        # framing around a 10 MB file and stays a finite ceiling.
        client_max_body_size 12m;
        proxy_pass http://triologue-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Files route, logged without the query string so the ?ft=<file token>
    # file token never reaches the access log (format defined at the top of
    # this file), as defence in depth: the file token is short-lived but
    # still a credential. Only logging and the redirect form change:
    # proxy_pass still forwards the query, which server/src/routes/files.ts
    # needs. ^~ likewise keeps location ~ \.html$ away from /api/files/, so
    # /api/files/x.html?ft=... cannot be served as the SPA page and logged
    # with the token.
    location ^~ /api/files/ {
        access_log /var/log/nginx/access.log files_without_query;
        # A request nginx redirects from this prefix (for example /api/files
        # without the trailing slash) gets a relative Location; an absolute
        # one is built from the request line and would spell the ?ft= file
        # token out into an http:// URL in the clear.
        absolute_redirect off;
        proxy_pass http://triologue-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Gateway (BYOA SSE and WebSocket)
    location /gateway/ {
        proxy_pass http://172.17.0.1:9500/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Socket.io
    location /socket.io/ {
        proxy_pass http://triologue-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
