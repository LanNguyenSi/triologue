# Default nginx config for the client image: plain HTTP on port 80, no TLS.
#
# client/Dockerfile COPYs this file to /etc/nginx/conf.d/default.conf, so it is
# what runs when the image starts with no volume over that path. The image
# ships no certificates, so this config must not carry any TLS directive: a
# default that pointed at certificate files would fail nginx at start and the
# container would restart-loop.
#
# Port 80 is the port both compose files expect inside the container
# (traefik.http.services.triologue.loadbalancer.server.port=80 in
# docker-compose.yml, "127.0.0.1:3000:80" in docker-compose.dev.yml). Both
# mount their own config over this one, so production and the dev stack are
# unaffected by this file: nginx/traefik.conf (behind Traefik, which owns TLS)
# and nginx/dev.conf respectively. To terminate TLS in the container instead,
# start it with a mount of the documented template client/nginx.conf.
#
# No CORS headers here: the SPA is same-origin (VITE_API_URL is empty in both
# compose files) and the API sets its own CORS headers in server/src/index.ts.
#
# http-level directives: this file is the /etc/nginx/conf.d/default.conf baked
# into the image, which nginx.conf includes inside http {}, so log_format is
# valid at this top level. client/src/lib/fileUrl.ts appends ?ft=<file token>,
# a short-lived file-scoped token, to /api/files/ URLs and
# server/src/routes/files.ts accepts it (never the session JWT); the default
# format logs "$request" with the query string, which would put the token in
# the container log. This format logs the request line without the query, for
# the files location only, as defence in depth: the token is short-lived but
# still a credential. Every other request keeps the default line.
log_format files_without_query '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
server {
    listen 80;
    server_name _;

    # Frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # HTML files - never cache
    location ~ \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri /index.html;
    }

    # Static assets - cache forever (fingerprinted)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API reverse proxy. The ^~ modifier makes this prefix win over the
    # regex location ~ \.html$ above, so an /api/ path can never be served
    # by it.
    location ^~ /api/ {
        # Let a full-size upload reach the server instead of nginx answering
        # 413 at its 1 MB default. Keep in step with MAX_FILE_SIZE (10 MB) in
        # server/src/routes/upload.ts; 12 MB adds headroom for the multipart
        # framing around a 10 MB file and stays a finite ceiling.
        client_max_body_size 12m;
        proxy_pass http://triologue-api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # Files route, logged without the query string so the ?ft=<file token>
    # file token never reaches the access log (format defined at the top of
    # this file), as defence in depth: the file token is short-lived but
    # still a credential. Only logging and the redirect form change:
    # proxy_pass still forwards the query, which server/src/routes/files.ts
    # needs. ^~ likewise keeps location ~ \.html$ away from /api/files/, so
    # /api/files/x.html?ft=... cannot be served as the SPA page and logged
    # with the token.
    location ^~ /api/files/ {
        access_log /var/log/nginx/access.log files_without_query;
        # A request nginx redirects from this prefix (for example /api/files
        # without the trailing slash) gets a relative Location; an absolute
        # one is built from the request line and would spell the ?ft= file
        # token out into an http:// URL in the clear.
        absolute_redirect off;
        proxy_pass http://triologue-api:3001/api/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Socket.io
    location /socket.io/ {
        proxy_pass http://triologue-api:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
