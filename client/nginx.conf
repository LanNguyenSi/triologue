# TLS template for a frontend container that terminates TLS itself.
#
# NOT baked into the image: client/Dockerfile copies the plain-HTTP
# client/nginx.default.conf instead, because the image ships no certificates.
# Production does not use this file either: docker-compose.yml mounts
# nginx/traefik.conf over /etc/nginx/conf.d/default.conf and leaves TLS to
# Traefik. To adopt this template, start the container with
# -v ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro plus the
# certificate directory and the ACME renewal paths it references.
#
# http-level directives: adopted configs are mounted at
# /etc/nginx/conf.d/default.conf, which nginx.conf includes inside http {}, so
# log_format is valid at this top level. client/src/lib/fileUrl.ts appends
# ?token=<jwt> to /api/files/ URLs and server/src/routes/files.ts accepts it;
# the default format logs "$request" with the query string, which would put
# the JWT in the container log. This format logs the request line without the
# query, for the files location only; every other request keeps the default
# line.
log_format files_without_query '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
#
# ── HTTP redirect to HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name opentriologue.ai www.opentriologue.ai;
    return 301 https://$server_name$request_uri;
}

# ── HTTPS main server ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name opentriologue.ai;

    # SSL certificates
    ssl_certificate     /etc/letsencrypt/live/opentriologue.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opentriologue.ai/privkey.pem;

    # SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # Frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # HTML files - never cache (to get latest asset references)
        location ~ \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "Thu, 01 Jan 1970 00:00:00 GMT";
        }

        # Assets (JS/CSS with hash) - cache aggressively (hash changes on update)
        location ~ \.(js|css|woff|woff2|ttf|svg|ico|png|jpg|jpeg|gif|webp)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # API proxy. The ^~ modifier makes this prefix win over every regex
    # location, so an /api/ path can never be picked up by a location ~ rule.
    location ^~ /api/ {
        # Let a full-size upload reach the server instead of nginx answering
        # 413 at its 1 MB default. Keep in step with MAX_FILE_SIZE (10 MB) in
        # server/src/routes/upload.ts; 12 MB adds headroom for the multipart
        # framing around a 10 MB file and stays a finite ceiling.
        client_max_body_size 12m;
        proxy_pass http://triologue-api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # No CORS headers here: the SPA is same-origin and the API sets its own
        # CORS headers (server/src/index.ts), so a preflight must reach it.
    }

    # Files route, logged without the query string so the ?token=<jwt> file
    # token never reaches the access log (format defined at the top of this
    # file). Only logging changes: proxy_pass still forwards the query, which
    # server/src/routes/files.ts needs. ^~ likewise keeps any regex location
    # away from /api/files/, so /api/files/x.html?token=... cannot be served
    # as the SPA page and logged with the token.
    location ^~ /api/files/ {
        access_log /var/log/nginx/access.log files_without_query;
        proxy_pass http://triologue-api:3001/api/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io WebSocket
    location /socket.io/ {
        proxy_pass http://triologue-api:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 10;
        proxy_buffering off;
    }

    # BYOA Agent Gateway — WebSocket proxy (wss://opentriologue.ai/byoa/ws)
    location /byoa/ {
        proxy_pass http://172.19.0.1:9500/byoa/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # BYOA Agent Gateway — REST (health, send)
    location /gateway/ {
        proxy_pass http://172.19.0.1:9500/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads
    location /uploads/ {
        proxy_pass http://triologue-api:3001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Redirect www to non-www ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.opentriologue.ai;

    ssl_certificate     /etc/letsencrypt/live/opentriologue.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opentriologue.ai/privkey.pem;

    return 301 https://opentriologue.ai$request_uri;
}
