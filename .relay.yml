name: triologue
health: /api/health
health_port: 3001
compose_file: docker-compose.yml
pre_update:
  # Self-heal missing .env. The triologue compose file declares
  # `env_file: .env`, so a missing file causes `compose up` to abort in
  # ~0.1s (too fast to be a build issue) — and the subsequent rollback
  # fails the same way, leaving the old containers running while the
  # deploy system reports "failed". Root cause on 2026-04-12 was the
  # local .env simply being gone from the VPS work tree. A canonical
  # copy lives one level up at `../.secrets/triologue.env` (host:
  # `/root/.openclaw/workspace/git/.secrets/triologue.env`, relay
  # container: `/apps/.secrets/triologue.env` via the same apps mount).
  # If both copies are gone we fail loudly before the 75s no-cache
  # build burns time on a guaranteed-broken deploy.
  - |
    if [ ! -f .env ]; then
      if [ -f ../.secrets/triologue.env ]; then
        echo "[preflight] .env missing — restoring from ../.secrets/triologue.env"
        cp ../.secrets/triologue.env .env
        chmod 600 .env
      else
        echo "[preflight] FATAL: .env missing and no canonical backup at ../.secrets/triologue.env" >&2
        echo "[preflight] Restore from lava-ice-logs/backups/triologue/ and retry." >&2
        exit 1
      fi
    fi
  - docker compose build --no-cache
post_update:
  # Read-only drift report, no schema write. The api container's entrypoint
  # already applies the committed migrations (`prisma migrate deploy`), and CI
  # fails when the migrations and schema.prisma disagree, so this step only
  # reports whether the live database still matches prisma/schema.prisma
  # (`--exit-code`: 0 = no difference, 2 = drift). It replaced `prisma db push`,
  # which rewrote the live schema from schema.prisma behind the migration
  # history (that is how production drifted from the migrations).
  # The entrypoint may still be applying migrations when this step starts, so
  # it first polls for about 90 s (longer when each status call is slow) until
  # `prisma migrate status` reports none pending. `$DATABASE_URL` is expanded by the shell inside the container.
  # A drift result only prints a warning and does not fail the deploy (the
  # step can still hit the relay's step timeout if the database is
  # unreachable): a
  # failing post_update step triggers the automatic rollback, which rebuilds the
  # previous commit but cannot change the database, so it would not repair
  # drift.
  - |
    docker compose exec -T -e HOME=/tmp api sh -c '
      i=0
      until npx prisma migrate status >/dev/null 2>&1 || [ "$i" -ge 30 ]; do
        i=$((i+1))
        sleep 3
      done
      npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
    ' && echo "[drift-check] live database matches prisma/schema.prisma" \
      || echo "[drift-check] WARNING: live database differs from prisma/schema.prisma or the check could not run (exit 2 = drift, see the diff above); the deploy continues"
rollback: true
