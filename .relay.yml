name: triologue
health: /api/health
health_port: 3001
compose_file: docker-compose.yml
pre_update:
  # Self-heal missing .env. The triologue compose file declares
  # `env_file: .env`, so a missing file causes `compose up` to abort in
  # ~0.1s (too fast to be a build issue) — and the subsequent rollback
  # fails the same way, leaving the old containers running while the
  # deploy system reports "failed". Root cause on 2026-04-12 was the
  # local .env simply being gone from the VPS work tree. A canonical
  # copy lives one level up at `../.secrets/triologue.env` (host:
  # `/root/.openclaw/workspace/git/.secrets/triologue.env`, relay
  # container: `/apps/.secrets/triologue.env` via the same apps mount).
  # If both copies are gone we fail loudly before the 75s no-cache
  # build burns time on a guaranteed-broken deploy.
  - |
    if [ ! -f .env ]; then
      if [ -f ../.secrets/triologue.env ]; then
        echo "[preflight] .env missing — restoring from ../.secrets/triologue.env"
        cp ../.secrets/triologue.env .env
        chmod 600 .env
      else
        echo "[preflight] FATAL: .env missing and no canonical backup at ../.secrets/triologue.env" >&2
        echo "[preflight] Restore from lava-ice-logs/backups/triologue/ and retry." >&2
        exit 1
      fi
    fi
  - docker compose build --no-cache
post_update:
  # Read-only drift report, no schema write. The api container's entrypoint
  # already applies the committed migrations (`prisma migrate deploy`), and CI
  # fails when the migrations and schema.prisma disagree, so this step only
  # reports whether the live database still matches prisma/schema.prisma
  # (`prisma migrate diff --exit-code`: 0 = no difference, 2 = drift). It
  # replaced `prisma db push`, which rewrote the live schema from schema.prisma
  # behind the migration history (that is how production drifted from the
  # migrations).
  # scripts/schema-drift-report.sh waits (about 90 s) until no migration is
  # pending, runs the diff inside the api container, prints the result and
  # records it in backups/schema-drift.status. The hourly
  # scripts/check-schema-drift.sh cron turns that record into a line in
  # /var/log/triologue-backup.log (see docs/deployment.md), so a drift
  # outlives the deploy log. The script always exits 0: a failing post_update
  # step triggers the automatic rollback, which rebuilds the previous commit but
  # cannot change the database, so it would not repair drift. (The step can
  # still hit the relay's step timeout if the database is unreachable.)
  - sh scripts/schema-drift-report.sh || echo "[drift-check] WARNING: the drift report script failed to run; the deploy continues"
rollback: true
