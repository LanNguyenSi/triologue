###############################################################################
# OpenTriologue - docker-compose.yml
#
# Production compose file: the one used by `make up`, `make deploy` and
# `.relay.yml` on the VPS. The local development stack lives in
# `docker-compose.dev.yml` (`make dev`, `make dev-full`) and runs as its own
# compose project (`triologue-dev`) with its own container names, network and
# volumes, so running the dev stack never recreates the production containers.
#
# Usage:
#   make up        Start all production services
#   make dev       Local backend stack (postgres + redis + api), dev project
#   make dev-full  Full local stack incl. frontend on :3000, dev project
#   make backup    Dump + uploads + api_data archives before any deploy
#   make deploy    Production deploy (backup -> build -> restart -> status)
#
# ⚠️  NEVER run `docker compose down -v`: this deletes the database!
###############################################################################

name: triologue

services:
  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: triologue-postgres
    environment:
      POSTGRES_DB: triologue
      POSTGRES_USER: triologue_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups                        # pg_dump target
    networks:
      triologue-network:
        aliases: [postgres]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triologue_user -d triologue"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Cache ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: triologue-redis
    volumes:
      - redis_data:/data
    networks:
      triologue-network:
        aliases: [redis]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: triologue-api
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://triologue_user:${POSTGRES_PASSWORD}@postgres:5432/triologue
      REDIS_URL: redis://redis:6379
    # Loopback only: the API is reached through Traefik/TLS (frontend proxy); host-local
    # consumers (agent gateway, reverse proxies) use localhost:4001. See docs/deployment.md.
    ports:
      - "127.0.0.1:4001:3001"
    networks:
      - triologue-network
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped
    volumes:
      - ./server/uploads:/app/uploads
      - api_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No memory limit here on purpose. An unmeasured ceiling on a Node 22 process
    # also lowers V8's default heap ceiling to about half of it, so a low cap can
    # turn ordinary load into heap or OOM exits. Add one only with a measured
    # figure recorded in docs/deployment.md.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend (Nginx) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Same-origin deploy: the SPA and API share an origin and Traefik/nginx
        # proxies /api to the backend. Client request paths already include the
        # /api prefix, so the base MUST be empty here. Set this to a bare origin
        # (e.g. https://api.example.com, with NO /api suffix) only when the API
        # is served from a different origin. A value ending in /api would
        # double-prefix every request to /api/api/... and 404.
        VITE_API_URL: ""
        # Baked into the client bundle at build time; empty keeps client Sentry off.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: triologue-frontend
    # No port mapping - Traefik handles SSL termination
    volumes:
      - ./nginx/traefik.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - triologue-network
      - traefik
    depends_on: [api]
    restart: unless-stopped
    # Ceiling against runaway use, not a measured figure; nginx serving static
    # assets plus the /api and /gateway proxies stays far below 512m.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.triologue.rule=Host(`opentriologue.ai`) || Host(`www.opentriologue.ai`)"
      - "traefik.http.routers.triologue.entrypoints=websecure"
      - "traefik.http.routers.triologue.tls=true"
      - "traefik.http.routers.triologue.tls.certresolver=letsencrypt"
      - "traefik.http.services.triologue.loadbalancer.server.port=80"

networks:
  triologue-network:
    driver: bridge
    name: triologue-network
  traefik:
    external: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_data:
    driver: local
